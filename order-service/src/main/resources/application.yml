server:
  port: 8081

spring:
  application:
    name: order-service
  threads:
    virtual:
      # Namastack bascule alors sur un exécuteur à threads virtuels (limité par executor-concurrency-limit)
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_write
    username: poc
    password: poc
    hikari:
      maximum-pool-size: 40
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Sérialiseur Jackson 3 de Spring Kafka 4 (Instant en ISO-8601 par défaut avec Jackson 3)
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Envoi synchrone par enregistrement côté Namastack : pas d'attente de batching
        linger.ms: 0
    template:
      # Span "send" + injection de traceparent dans les en-têtes Kafka
      observation-enabled: true

namastack:
  outbox:
    # Délai fixe entre la fin d'un poll et le suivant (remplace poll-interval / batch-size, dépréciés en 1.9)
    polling:
      trigger: fixed
      fixed:
        interval: 100ms
      batch-size: 100
    processing:
      # Nombre de clés (commandes) traitées en parallèle dans un lot
      executor-concurrency-limit: 16
    jdbc:
      # Namastack crée ses tables (outbox_record, outbox_instance, outbox_partition) au démarrage
      schema-initialization:
        enabled: true
    kafka:
      enabled: true
      default-topic: orders.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # Corrélation métier : "order.id" voyage avec la trace (en-tête W3C baggage en HTTP / Kafka, contexte outbox),
  # est ajouté en tag sur chaque span (recherche Jaeger order.id=...) et dans le MDC des logs.
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: order.id
      tag-fields: order.id
      correlation:
        fields: order.id
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Métriques exposées uniquement via le scrape Prometheus
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        outbox.record.process: true
        outbox.record.schedule: true
        spring.kafka.template: true

logging:
  pattern:
    # ajoute order.id (baggage) aux logs, à côté de traceId/spanId
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},order.id=%X{order.id:-}] "

# Requêtes SQL en spans (datasource-micrometer, conventions sémantiques OTel : db.query.text anonymisé,
# db.query.summary). Pas de valeurs de paramètres (données personnelles) : include-parameter-values=false.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false
