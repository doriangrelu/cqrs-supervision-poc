# Valeurs par défaut communes à tous les services (priorité la plus basse, surchargeables).
# Convention 12-factor : chaque valeur dépendant de l'environnement est lue dans une variable d'environnement,
# avec une valeur par défaut adaptée au poste de dev (docker compose de infra/).

# --- Traces -----------------------------------------------------------------------------------------------
# 1.0 en local ; en production typiquement 0.05 à 0.2 (échantillonnage à la racine, respecté en aval)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes[deployment.environment.name]=${DEPLOYMENT_ENVIRONMENT:local}

# --- Métriques : scrape Prometheus (exemplars), pas de push OTLP --------------------------------------------
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Endpoints d'exploitation -------------------------------------------------------------------------------
# Kubernetes : /actuator/health/liveness et /actuator/health/readiness
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.info.env.enabled=false

# --- Arrêt propre : fin des requêtes / messages en cours avant l'arrêt -----------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# --- Erreurs HTTP au format RFC 9457 (application/problem+json) --------------------------------------------------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# --- Logs : texte lisible en local, JSON structuré en production (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs) ----------
# traceId/spanId ajoutés automatiquement (texte et JSON) ; les champs de baggage déclarés en
# management.tracing.baggage.correlation.fields sont dans le MDC.

# --- Requêtes SQL en spans (datasource-micrometer), sans valeurs de paramètres (données personnelles) ------------
jdbc.includes=connection,query
jdbc.datasource-proxy.include-parameter-values=false
