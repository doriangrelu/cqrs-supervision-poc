server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    # Spring Cloud 2025.1 cible Boot 4.0 ; on tourne sur Boot 4.1 (imposé par Namastack 1.9)
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webmvc:
          routes:
            # Côté lecture (CQRS query) : projections
            - id: order-projector
              uri: http://localhost:8082
              predicates:
                - Path=/orders-view/**
            # Côté écriture (CQRS command) : service propriétaire de la donnée
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**,/orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false   # métriques en scrape Prometheus (exemplars)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
