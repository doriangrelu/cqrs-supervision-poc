# Configuration propre au projecteur. Les valeurs communes (tracing, OTLP, actuator, probes, arrêt propre,
# ProblemDetail, SQL en spans...) viennent du starter observability-starter (observability-defaults.properties).
# 12-factor : ce qui dépend de l'environnement est lu dans une variable d'environnement, avec un défaut local
# (docker compose de infra/).

server:
  port: 8082

spring:
  application:
    name: order-projector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_read}
    username: ${DB_USERNAME:poc}
    password: ${DB_PASSWORD:poc}
    hikari:
      # >= concurrence Kafka (une connexion par consommateur) + marge pour l'API de lecture
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-projector
      # Nouveau groupe (1er déploiement, ou group-id changé pour reconstruire) : lecture depuis le début du topic,
      # donc projection complète. "latest" ignorerait tout l'historique. Sans effet sur un groupe existant, qui
      # reprend à ses offsets commités. Procédure de reconstruction : cf. Javadoc de KafkaConfig.
      auto-offset-reset: earliest
      # Ne lit que les messages de transactions Kafka validées. Le producteur actuel (outbox) n'est pas
      # transactionnel : aucun coût ni effet aujourd'hui, mais protège la projection s'il le devient
      # (sinon les messages de transactions annulées seraient projetés).
      isolation-level: read_committed
      # clé et valeur en String ; la valeur JSON est convertie en OrderEvent (cf. KafkaConfig)
      # Taille d'un lot : lot x durée max d'un traitement (+ backoff des retries) doit rester < max.poll.interval.ms,
      # sinon le consommateur est exclu du groupe et le lot relivré à un autre. 100 x ~10 ms : large marge.
      max-poll-records: 100
      properties:
        # délai max entre deux poll() avant exclusion du groupe (valeur Kafka par défaut, rendue explicite)
        max.poll.interval.ms: 300000
    listener:
      # un consommateur par partition d'orders.events (6) ; au-delà, des consommateurs restent inactifs
      concurrency: ${PROJECTOR_CONCURRENCY:6}
      # commit de l'offset après chaque message : relivraison minimale après un crash (les relivraisons restent
      # inoffensives grâce à l'upsert idempotent ; "batch" serait plus économe en commits)
      ack-mode: record
      observation-enabled: true
    template:
      # envoi vers le DLT tracé, dans la trace du message d'origine
      observation-enabled: true

# Reprise sur erreur rejouable (backoff exponentiel puis DLT). Valeurs par défaut dans ProjectorProperties :
# projector.retry.max-attempts=5, initial-interval=500ms, multiplier=2.0, max-interval=5s

management:
  # Corrélation métier : "order.id" voyage avec la trace (en-tête W3C baggage en HTTP / Kafka, contexte outbox),
  # est ajouté en tag sur chaque span (recherche Jaeger order.id=...) et dans le MDC des logs.
  tracing:
    baggage:
      remote-fields: order.id
      tag-fields: order.id
      correlation:
        fields: order.id

logging:
  level:
    org.apache.kafka: WARN
  pattern:
    # ajoute order.id (baggage, via le MDC) aux logs texte, à côté de traceId/spanId ; en JSON structuré
    # (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs), tout le MDC est inclus automatiquement
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},order.id=%X{order.id:-}] "
