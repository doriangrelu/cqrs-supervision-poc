# Règles d'alerte de la chaîne CQRS. Seuils de départ à ajuster selon les SLO métier.
# Chaque alerte pointe vers la section du runbook (docs/observability.md#runbook).
groups:
  - name: cqrs-coherence
    rules:
      - alert: ProjectionLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(projection_lag_seconds_bucket[5m]))) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Lag de cohérence p95 > 5 s depuis 5 min"
          description: "Les lectures (projections) sont en retard de {{ $value | humanizeDuration }} sur les écritures."
          runbook: "docs/observability.md#projectionlaghigh"

      - alert: ConsumerLagGrowing
        expr: sum by (consumergroup) (kafka_consumergroup_lag{topic="orders.events"}) > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Retard Kafka > 1000 messages pour {{ $labels.consumergroup }}"
          runbook: "docs/observability.md#consumerlaggrowing"

      - alert: OutboxBacklog
        expr: sum by (application) (outbox_records{outbox_record_status="new"}) > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Outbox de {{ $labels.application }} : {{ $value }} événements non publiés"
          description: "Kafka indisponible ou publication trop lente : les écritures ne sont plus propagées."
          runbook: "docs/observability.md#outboxbacklog"

      - alert: OutboxRecordsFailed
        expr: sum by (application) (outbox_records{outbox_record_status="failed"}) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Outbox de {{ $labels.application }} : événements en échec définitif"
          description: "Événements qui ne seront jamais publiés sans intervention : les projections divergent."
          runbook: "docs/observability.md#outboxrecordsfailed"

      - alert: DeadLetterMessages
        expr: sum(increase(projection_dlt_total[10m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} message(s) envoyé(s) en DLT sur les 10 dernières minutes"
          description: "Événements non projetés : la vue de lecture est incomplète pour ces commandes."
          runbook: "docs/observability.md#deadlettermessages"

  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job="spring-apps"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} ne répond plus au scrape Prometheus"
          runbook: "docs/observability.md#servicedown"

      - alert: HttpErrorRateHigh
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} : plus de 5 % de réponses 5xx"
          runbook: "docs/observability.md#httperrorratehigh"
