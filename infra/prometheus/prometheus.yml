global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    # OpenMetrics requis pour récupérer les exemplars (traceId) exposés par Micrometer
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { application: gateway }
      - targets: ["host.docker.internal:8081"]
        labels: { application: order-service }
      - targets: ["host.docker.internal:8082"]
        labels: { application: order-projector }

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
