global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Applis Spring Boot : le label "application" est posé par les applis elles-mêmes (management.metrics.tags).
  # Qu'elles tournent sur l'hôte (IDE, scripts/run-apps.sh) ou en conteneur (profil compose "apps"),
  # leurs ports sont publiés sur l'hôte.
  - job_name: spring-apps
    metrics_path: /actuator/prometheus
    # OpenMetrics requis pour récupérer les exemplars (traceId) exposés par Micrometer
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets:
          - host.docker.internal:8080
          - host.docker.internal:8081
          - host.docker.internal:8082

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
